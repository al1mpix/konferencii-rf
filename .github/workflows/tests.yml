name: Laravel PHP syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml
          coverage: none

      - name: Check PHP syntax
        run: find app bootstrap config database public routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Composer manifest
        run: php -r '$m = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); if (($m["require"]["laravel/framework"] ?? "") !== "^10.10") { throw new RuntimeException("Unexpected Laravel version constraint."); } echo "composer.json is valid and targets Laravel 10.10+ within major 10.\n";'
