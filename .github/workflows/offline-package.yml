name: Build Laravel package for local Windows setup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Confirm Laravel bootstraps
        run: php artisan --version

      - name: Upload ready-to-extract Laravel project
        uses: actions/upload-artifact@v4
        with:
          name: konferencii-rf-windows-ready
          path: |
            .
            !.git/**
            !.github/**
            !.phpunit.result.cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
