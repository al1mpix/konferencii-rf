<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
<rect width="960" height="500" fill="#f6f4ef"/>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d2b3a">ER-диаграмма · Конференции.РФ (MySQL)</text>
<rect x="56" y="94" width="350" height="320" rx="8" fill="#fff" stroke="#285779" stroke-width="2"/>
<path d="M56 140H406" stroke="#285779" stroke-width="2"/>
<text x="80" y="124" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#285779">users</text>
<g font-family="Arial, sans-serif" font-size="14" fill="#1d2b3a">
<text x="80" y="169">PK   id BIGINT</text>
<text x="80" y="201">UQ   login VARCHAR(40)</text>
<text x="80" y="233">     full_name VARCHAR(150)</text>
<text x="80" y="265">     phone VARCHAR(20)</text>
<text x="80" y="297">UQ   email VARCHAR(255)</text>
<text x="80" y="329">     password VARCHAR(255)</text>
<text x="80" y="361">     remember_token</text>
<text x="80" y="393">     created_at / updated_at</text>
</g>
<rect x="554" y="94" width="350" height="354" rx="8" fill="#fff" stroke="#285779" stroke-width="2"/>
<path d="M554 140H904" stroke="#285779" stroke-width="2"/>
<text x="578" y="124" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#285779">bookings</text>
<g font-family="Arial, sans-serif" font-size="14" fill="#1d2b3a">
<text x="578" y="169">PK   id BIGINT</text>
<text x="578" y="201">FK   user_id BIGINT</text>
<text x="578" y="233">     room VARCHAR(40)</text>
<text x="578" y="265">     event_date DATE</text>
<text x="578" y="297">     payment VARCHAR(60)</text>
<text x="578" y="329">     status VARCHAR(60)</text>
<text x="578" y="361">     review TEXT, nullable</text>
<text x="578" y="393">     created_at / updated_at</text>
</g>
<path d="M406 239H480V201H554" stroke="#285779" stroke-width="3" fill="none"/>
<path d="M544 194L554 201L544 208" stroke="#285779" stroke-width="3" fill="none"/>
<text x="438" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#285779">1 : N</text>
<text x="56" y="474" font-family="Arial, sans-serif" font-size="13" fill="#68727d">Один пользователь может создать несколько заявок. Каждая заявка принадлежит одному пользователю.</text>
</svg>